services:
  postgres:
    image: postgres:16-alpine
    container_name: ambigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambigo
      POSTGRES_PASSWORD: ambigo_dev_password
      POSTGRES_DB: ambigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambigo -d ambigo"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: postgres -c max_connections=100 -c shared_buffers=256MB

  # Optional: pgAdmin for local inspection (http://localhost:5050)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@ambigo.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  pgdata:
    driver: local
